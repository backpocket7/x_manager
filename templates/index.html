<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X Manager</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="app-layout">
        <header class="header">
            <div class="header-top">
                <a href="/" class="header-logo"><img src="/static/favicon.svg" width="20" height="20" alt="X"></a>
                <h1>X <span style="color: var(--primary)">Manager</span></h1>
            </div>
        </header>
        <div id="pane-container" class="pane-container"></div>
    </div>

    <!-- Modal -->
    <div id="modal-overlay" class="modal-overlay" style="display:none">
        <div class="modal" id="modal">
            <div class="modal-header">
                <h3 id="modal-title"></h3>
                <button class="modal-close" id="modal-close">&times;</button>
            </div>
            <div class="modal-body" id="modal-body"></div>
            <div class="modal-footer">
                <button class="btn" id="modal-cancel">Cancel</button>
                <button class="btn btn-primary" id="modal-submit">Save</button>
            </div>
        </div>
    </div>

    <script src="/static/js/api.js"></script>
    <script src="/static/js/app.js"></script>
</body>
</html>
